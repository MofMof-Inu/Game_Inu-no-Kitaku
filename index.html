<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>犬の帰宅｜Game Inu no Kitaku</title>

  <!-- OGP -->
  <meta property="og:title" content="犬の帰宅｜Inu no Kitaku">
  <meta property="og:description" content="花を踏まずに家に帰ろう！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mofmof-inu.github.io/Game_Inu-no-Kitaku/">

  <meta name="description" content="花を踏まずに家に帰ろう！">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game-page">
    <h1 class="game-title">犬の帰宅</h1>

    <div class="game-wrapper">
      <canvas id="gameCanvas" width="800" height="400"></canvas>

      <div id="gameMessage" class="game-message">
        <div id="messageTitle">花を踏まずに家に帰ろう</div>
        <div id="messageText">スペースキーまたは画面タップでスタート</div>
      </div>
    </div>

    <div class="game-info">
      <span>SCORE: <strong id="score">0</strong></span>
      <span>HIGH SCORE: <strong id="highScore">0</strong></span>
    </div>

    <p class="controls">
      PC：スペースキーでジャンプ ／ スマホ：画面タップでジャンプ
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
